run:
  name: failure_collocation_starvation
  output_dir: runs
  seed: 7
  deterministic: true
  device: cuda
  dtype: float32
  failure_label: collocation_starvation

pde:
  name: poisson_1d
  domain: [-1.0, 1.0]
  source: 1.0
  forcing: 0.0
  diffusion: 0.01
  boundary_values: [0.0, 0.0]
  validation_points: 1001

model:
  input_dim: 1
  output_dim: 1
  hidden_layers: [64, 64, 64]
  activation: tanh
  init: xavier

training:
  optimizer: adam
  learning_rate: 0.001
  steps: 10000
  interior_points: 4      # Further reduced — only 4 interior points
  boundary_points: 2
  log_every: 50
  checkpoint_every: 500
  lambda_pde: 1.0
  lambda_bc: 1.0
  resample_every: 0
  spatial_bias: 0.8  # Bias sampling toward boundaries, leaving interior under-sampled

logging:
  save_activations: true
  activation_layers: [0, 1, 2]
  save_pointwise_residuals: true
  log_gradients: true
  grad_log_every: 50
  log_diagnostics: true
  diag_log_every: 50
