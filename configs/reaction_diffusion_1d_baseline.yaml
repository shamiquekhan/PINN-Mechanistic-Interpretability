run:
  name: reaction_diffusion_baseline
  output_dir: runs
  seed: 7
  deterministic: true
  device: cuda
  dtype: float32

pde:
  name: reaction_diffusion_1d
  domain: [-1.0, 1.0]
  source: 1.0          # reaction coefficient μ
  forcing: 1.0         # constant source f — REQUIRED nonzero: with f=0 and
                       # homogeneous Dirichlet BCs the exact solution is
                       # u ≡ 0 and the relative-L2 metric is 0/0 (degenerate)
  diffusion: 0.01      # ε — small → stiff boundary layer
  boundary_values: [0.0, 0.0]
  validation_points: 1001

model:
  input_dim: 1
  output_dim: 1
  hidden_layers: [64, 64, 64, 64]
  activation: tanh
  init: xavier

training:
  optimizer: adam
  learning_rate: 0.001
  steps: 10000
  interior_points: 256
  boundary_points: 2
  log_every: 100
  checkpoint_every: 1000
  lambda_pde: 1.0
  lambda_bc: 1.0
  resample_every: 0

logging:
  save_activations: true
  activation_layers: [0, 1, 2]
  save_pointwise_residuals: true
  log_gradients: true
  grad_log_every: 100
  log_diagnostics: true
  diag_log_every: 100
