run:
  name: burgers_1d_baseline
  output_dir: runs
  seed: 7
  deterministic: true
  device: cuda
  dtype: float32
  failure_label: unlabeled

pde:
  name: burgers_1d
  domain: [-1.0, 1.0]
  time_domain: [0.0, 1.0]
  source: 1.0
  forcing: 0.0
  diffusion: 0.01        # viscosity nu
  boundary_values: [0.0, 0.0]
  validation_points: 400

model:
  input_dim: 2            # (t, x)
  output_dim: 1
  hidden_layers: [64, 64, 64]
  activation: tanh
  init: xavier

training:
  optimizer: adam
  learning_rate: 0.001
  steps: 10000
  interior_points: 512
  boundary_points: 66
  log_every: 50
  checkpoint_every: 1000
  lambda_pde: 1.0
  lambda_bc: 10.0
  resample_every: 100

logging:
  save_activations: true
  activation_layers: [1]
  save_pointwise_residuals: true
  log_gradients: true
  grad_log_every: 100
  log_diagnostics: false
  diag_log_every: 100
