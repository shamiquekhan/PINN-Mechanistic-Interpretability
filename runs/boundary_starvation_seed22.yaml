run:
  name: boundary_starvation_seed22
  output_dir: runs
  seed: 22
  deterministic: true
  device: cuda
  dtype: float32
pde:
  name: poisson_1d
  domain:
  - -1.0
  - 1.0
  source: 1.0
  forcing: 0.0
  diffusion: 0.01
  boundary_values:
  - 0.0
  - 0.0
  validation_points: 1001
model:
  input_dim: 1
  output_dim: 1
  hidden_layers:
  - 64
  - 64
  - 64
  activation: tanh
  init: xavier
training:
  optimizer: adam
  learning_rate: 0.001
  steps: 5000
  interior_points: 256
  boundary_points: 2
  log_every: 500
  checkpoint_every: 5000
  lambda_pde: 100.0
  lambda_bc: 0.01
  resample_every: 0
logging:
  save_activations: true
  activation_layers:
  - 1
  save_pointwise_residuals: false
  log_gradients: false
  log_diagnostics: false
