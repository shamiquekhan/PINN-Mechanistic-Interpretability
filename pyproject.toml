[project]
name = "pinn-mechanistic"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "pyyaml>=6.0", "pydantic>=2.6", "matplotlib>=3.8", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pinn*", "pinn_logging*", "experiments*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
