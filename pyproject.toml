[project]
name = "pinn-mechanistic"
version = "3.0.0"
description = "Mechanistic interpretability for physics-informed neural networks: sparse autoencoders, causal interventions, causal abstraction, early-warning monitors, and closed-loop control"
readme = "README.md"
license = { text = "CC-BY-4.0" }
requires-python = ">=3.10"
authors = [
	{ name = "Shamique Khan" },
]
keywords = [
	"physics-informed neural networks",
	"mechanistic interpretability",
	"sparse autoencoders",
	"superposition",
	"causal abstraction",
	"scientific machine learning",
]
dependencies = [
	"torch>=2.2",
	"numpy>=1.26",
	"pyyaml>=6.0",
	"pydantic>=2.6",
	"matplotlib>=3.8",
	"scikit-learn>=1.4",
	"scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/shamiquekhan/PINN-Mechanistic-Interpretability"

[tool.setuptools.packages.find]
where = ["."]
include = [
	"analysis*",
	"controller*",
	"experiments*",
	"figures*",
	"interventions*",
	"monitoring*",
	"operators*",
	"pinn*",
	"pinn_logging*",
	"sae*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
	"slow: long-running integration or end-to-end test",
]
