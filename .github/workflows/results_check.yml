name: results-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  grounded:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail if results docs cite numbers with no run artifact
        run: python scripts/check_results_grounded.py
