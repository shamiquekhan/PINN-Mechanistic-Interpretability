name: repository-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Checksums
        run: sha256sum -c data/checksums.sha256

      - name: Results grounding
        run: python scripts/check_results_grounded.py

      - name: Repository audit
        run: python scripts/final_repo_audit.py
